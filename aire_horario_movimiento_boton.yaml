blueprint:
  name: Aire - horario laboral, movimiento y botón
  description: >
    - Enciende el termostato a la hora de inicio SOLO si Workday está encendido.
    - Apaga el termostato a la hora de fin TODOS los días (hábil o no).
    - Dentro de la franja, en día hábil y con el aire encendido:
      movimiento = temperatura ocupada (23 °C), sin movimiento = temperatura vacía (26 °C).
      El movimiento NUNCA enciende el aire, solo ajusta la temperatura.
    - Fuera del horario hábil (fuera de la franja o con Workday apagado): si el aire
      está encendido y no hay movimiento durante el tiempo configurado, lo apaga.
    - Tercer botón del interruptor: si el botón enciende, enciende el aire a 23 °C;
      si el botón apaga, apaga el aire. Funciona a cualquier hora.
  domain: automation
  input:
    thermostat:
      name: Termostato
      selector:
        entity:
          domain: climate
    workday:
      name: Sensor Workday
      selector:
        entity:
          domain: binary_sensor
          integration: workday
    motion:
      name: Sensores de movimiento / presencia
      description: >
        Sensores de movimiento o contactos secos (on = hay movimiento, off = no hay).
        Si hay varios, basta con que uno esté en on para considerar el aula ocupada.
      selector:
        entity:
          domain:
            - binary_sensor
            - switch
            - input_boolean
          multiple: true
    start_time:
      name: Hora de encendido
      default: "06:00:00"
      selector:
        time: {}
    end_time:
      name: Hora de apagado (todos los días)
      default: "15:00:00"
      selector:
        time: {}
    temp_occupied:
      name: Temperatura con movimiento / al encender con el botón
      default: 23
      selector:
        number:
          min: 16
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
    temp_empty:
      name: Temperatura sin movimiento
      default: 26
      selector:
        number:
          min: 16
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
    no_motion_delay:
      name: Tiempo sin movimiento
      description: >
        Tiempo sin movimiento para subir a la temperatura vacía (en horario hábil)
        o para apagar el aire (fuera del horario hábil).
      default:
        minutes: 5
      selector:
        duration: {}
    hvac_mode:
      name: Modo de operación al encender
      default: cool
      selector:
        select:
          options:
            - label: Frío
              value: cool
            - label: Frío/Calor
              value: heat_cool
            - label: Auto
              value: auto
    button:
      name: Tercer botón del interruptor
      description: Entidad on/off del canal 3 del interruptor (switch o light).
      selector:
        entity:
          domain:
            - switch
            - light
            - input_boolean
    sync_button:
      name: Sincronizar el botón con el aire
      description: >
        Cuando la automatización enciende o apaga el aire, pone el botón en el mismo
        estado, para que la siguiente pulsación haga lo que el usuario espera.
      default: true
      selector:
        boolean: {}

mode: queued
max: 10

variables:
  thermostat: !input thermostat
  button: !input button
  sync_button: !input sync_button
  motion_sensors: !input motion
  temp_occupied: !input temp_occupied
  temp_empty: !input temp_empty
  hvac_mode: !input hvac_mode
  delay_input: !input no_motion_delay
  delay_seconds: >
    {{ (delay_input.hours | default(0) | int) * 3600
       + (delay_input.minutes | default(0) | int) * 60
       + (delay_input.seconds | default(0) | int) }}
  occupied: "{{ motion_sensors | select('is_state', 'on') | list | count > 0 }}"
  # Ningún sensor en on y todos llevan al menos el tiempo configurado sin movimiento
  empty_long_enough: >
    {{ not occupied and
       expand(motion_sensors)
         | selectattr('last_changed', 'gt', now() - timedelta(seconds=delay_seconds | int))
         | list | count == 0 }}
  target_temp: "{{ temp_occupied if occupied else temp_empty }}"

triggers:
  - trigger: time
    at: !input start_time
    id: start
  - trigger: time
    at: !input end_time
    id: end
  - trigger: state
    entity_id: !input motion
    to: "on"
    id: motion_on
  - trigger: state
    entity_id: !input motion
    to: "off"
    for: !input no_motion_delay
    id: motion_off
  # Aire encendido (p. ej. con el botón) sin que nadie se mueva después
  - trigger: state
    entity_id: !input thermostat
    from: "off"
    not_to:
      - unavailable
      - unknown
    for: !input no_motion_delay
    id: ac_on
  - trigger: state
    entity_id: !input button
    from: "off"
    to: "on"
    id: button_on
  - trigger: state
    entity_id: !input button
    from: "on"
    to: "off"
    id: button_off

actions:
  - choose:
      # 1 y 2) Encendido a la hora de inicio, solo en día hábil
      - conditions:
          - condition: trigger
            id: start
          - condition: state
            entity_id: !input workday
            state: "on"
        sequence:
          - action: climate.set_temperature
            target:
              entity_id: "{{ thermostat }}"
            data:
              hvac_mode: "{{ hvac_mode }}"
              temperature: "{{ target_temp }}"
          - if: "{{ sync_button and not is_state(button, 'on') }}"
            then:
              - action: homeassistant.turn_on
                target:
                  entity_id: "{{ button }}"

      # 1 y 2) Apagado a la hora de fin, todos los días
      - conditions:
          - condition: trigger
            id: end
        sequence:
          - action: climate.set_hvac_mode
            target:
              entity_id: "{{ thermostat }}"
            data:
              hvac_mode: "off"
          - if: "{{ sync_button and not is_state(button, 'off') }}"
            then:
              - action: homeassistant.turn_off
                target:
                  entity_id: "{{ button }}"

      # 3) Ajuste por movimiento dentro de la franja hábil (no enciende el aire)
      - conditions:
          - condition: trigger
            id:
              - motion_on
              - motion_off
          - condition: state
            entity_id: !input workday
            state: "on"
          - condition: time
            after: !input start_time
            before: !input end_time
          - condition: template
            value_template: >
              {{ states(thermostat) not in ['off', 'unavailable', 'unknown']
                 and state_attr(thermostat, 'temperature') | float(0) != target_temp | float(0) }}
        sequence:
          - action: climate.set_temperature
            target:
              entity_id: "{{ thermostat }}"
            data:
              temperature: "{{ target_temp }}"

      # 5) Fuera del horario hábil: sin movimiento durante el tiempo configurado -> apagar
      - conditions:
          - condition: trigger
            id:
              - motion_off
              - ac_on
          - condition: not
            conditions:
              - condition: and
                conditions:
                  - condition: state
                    entity_id: !input workday
                    state: "on"
                  - condition: time
                    after: !input start_time
                    before: !input end_time
          - condition: template
            value_template: >
              {{ states(thermostat) not in ['off', 'unavailable', 'unknown']
                 and empty_long_enough }}
        sequence:
          - action: climate.set_hvac_mode
            target:
              entity_id: "{{ thermostat }}"
            data:
              hvac_mode: "off"
          - if: "{{ sync_button and not is_state(button, 'off') }}"
            then:
              - action: homeassistant.turn_off
                target:
                  entity_id: "{{ button }}"

      # 4) Botón enciende -> aire encendido a 23 °C
      #    (se ignoran los cambios del botón hechos por esta misma automatización)
      - conditions:
          - condition: trigger
            id: button_on
          - condition: template
            value_template: "{{ trigger.to_state.context.parent_id is none }}"
        sequence:
          - action: climate.set_temperature
            target:
              entity_id: "{{ thermostat }}"
            data:
              hvac_mode: "{{ hvac_mode }}"
              temperature: "{{ temp_occupied }}"

      # 4) Botón apaga -> aire apagado
      - conditions:
          - condition: trigger
            id: button_off
          - condition: template
            value_template: "{{ trigger.to_state.context.parent_id is none }}"
        sequence:
          - action: climate.set_hvac_mode
            target:
              entity_id: "{{ thermostat }}"
            data:
              hvac_mode: "off"
